project:
  type: book
  output-dir: _site

resources: 
  - "./assets/siunitx.js"
  
lang: fr  

book:
  title: "Modulation électro-optique"
  author: "Christophe Peucheret"
  #output-file: "test"
  date: last-modified
  date-format: "DD MMMM YYYY"
  site-url: http://www.cpeu.dk/teaching/modu
  repo-url: https://github.com/cpeucher/light-modulation
  repo-branch: main
  repo-actions: [edit, issue]
  downloads: pdf
  chapters:
    - index.qmd
    - 0-tests.qmd
    - 0-notations.qmd
    - 1-introduction.qmd
    - 2-effet_eo.qmd
    - 3-bases_modulation_eo.qmd
    - 4-modulateurs_integres.qmd
    - 5-autres_methodes.qmd
    - references.qmd
bibliography: "references.bib"
csl: "optica_mod.csl"
citation-abbreviations: "journal_abbreviations.json"

website:
  reader-mode: true


format:
  html:
    theme: cosmo
    code-fold: true
    code-summary: "Voir le code"
    html-math-method: mathjax
    include-in-header: 
      - file: macros_equations.html
      - file: mathjax-config.html
    number-depth: 2
    #resource-path: ["figures/png"]
  pdf:
    documentclass: scrreprt
    papersize: a4
    include-in-header: 
      - text: |
          \usepackage{unicode-math}
          \usepackage{ragged2e}
          \usepackage{siunitx}
          \sisetup{inter-unit-product = \ensuremath{{}\cdot{}}}
          \usepackage[version=4]{mhchem}
      - file: macros_equations.tex
    number-depth: 2
    echo: false
    #resource-path: ["figures/pdf"]
jupyter: python3






