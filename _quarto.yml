project:
  type: book
  output-dir: _site

resources:
  - "./assets/siunitx.js"
  
lang: fr
language:
  crossref-eq-prefix: ""
  crossref-fig-prefix: "figure"

book:
  title: "Modulation électro-optique"
  author: "Christophe Peucheret"
  #output-file: "test"
  date: last-modified
  date-format: "DD MMMM YYYY"
  site-url: http://www.cpeu.dk/teaching/modu
  repo-url: https://github.com/cpeucher/light-modulation
  repo-branch: main
  repo-actions: [edit, issue]
  downloads: pdf
  chapters:
    - index.qmd
    - chapters/0-tests.qmd
    - chapters/0-notations.qmd
    - chapters/1-introduction_modulation.qmd
    - chapters/2-effet_eo.qmd
    - chapters/3-bases_modulation_eo.qmd
    - chapters/4-modulateurs_integres.qmd
    - chapters/5-autres_methodes.qmd
    - references.qmd
bibliography: 
  #"references.bib"
  "C:/_cpeu/bibliographies/bibfiles/library.bib"

csl: "optica_mod.csl"
citation-abbreviations: "journal_abbreviations.json"

website:
  reader-mode: true

format:
  html:
    theme: cosmo
    code-fold: true
    code-summary: "Voir le code"
    html-math-method: mathjax
    include-in-header: 
      - file: macros_equations.html
      - file: mathjax-config.html
    number-depth: 2
    #resource-path: ["figures/png"]
    #resource-path: 
      #- "../figures/png"
    include-after-body: "assets/reflinks.js"
  pdf:
    documentclass: scrreprt
    papersize: a4
    include-in-header: 
      - text: |
          \usepackage{unicode-math}
          \usepackage{ragged2e}
          \usepackage{siunitx}
          \sisetup{inter-unit-product = \ensuremath{{}\cdot{}}}
          \usepackage[version=4]{mhchem}
          \usepackage{xcolor}
          \definecolor{mred}{rgb}{0.7,0,0.1}
      - file: macros_equations.tex
    number-depth: 2
    echo: false
    #resource-path: ["figures/pdf"]
    link-citations: true
    link-bibliography: true
    keep-tex: true
    fig-pos: t
jupyter: python3

execute:
  freeze: auto

from: markdown+emoji